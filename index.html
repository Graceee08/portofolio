<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Grace Febriani – Portfolio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #fff7f3;
            --sf: #fff;
            --mint: #e8f9f7;
            --lav: #eef0ff;
            --peach: #fff0e9;
            --ink: #2d2f4a;
            --muted: #5c5c7b;
            --ac: #8d9bf1;
            --pink: #c93d65;
            --line: #e6e2f2;
            --hf: 'Fredoka', 'Trebuchet MS', sans-serif;
            --bf: 'Nunito', 'Segoe UI', sans-serif;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #1d1e2f;
                --sf: #27283d;
                --mint: #1f3a3a;
                --lav: #2b2e52;
                --peach: #3a2c2c;
                --ink: #f3f1fb;
                --muted: #bdbbd6;
                --ac: #a9b4ff;
                --pink: #ff9db7;
                --line: #3b3d5c
            }
        }

        :root[data-theme="dark"] {
            --bg: #1d1e2f;
            --sf: #27283d;
            --mint: #1f3a3a;
            --lav: #2b2e52;
            --peach: #3a2c2c;
            --ink: #f3f1fb;
            --muted: #bdbbd6;
            --ac: #a9b4ff;
            --pink: #ff9db7;
            --line: #3b3d5c
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            scroll-behavior: smooth
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 1.0625rem/1.65 var(--bf)
        }

        .w {
            width: 96%;
            max-width: 105rem;
            margin: 0 auto;
            padding: 0 1rem
        }

        h1,
        h2,
        h3 {
            font-family: var(--hf);
            font-weight: 600;
            line-height: 1.12;
            margin: 0
        }

        a {
            color: inherit
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 0;
            gap: 1rem;
            flex-wrap: wrap
        }

        nav b {
            font-family: var(--hf);
            font-size: 1.2rem;
            text-decoration: none
        }

        nav div {
            display: flex;
            gap: 1.25rem;
            font-weight: 700
        }

        nav a {
            text-decoration: none
        }

        nav a:hover {
            color: var(--pink)
        }

        .hero {
            padding: 3rem 0 3.5rem
        }

        .hero h1 {
            font-size: clamp(1.85rem, 3.8vw, 3.5rem);
            letter-spacing: -.02em;
            margin-bottom: 1rem;
            line-height: 1.18
        }

        @media (min-width: 820px) {
            .hero h1 {
                white-space: nowrap
            }
        }

        .hero p {
            max-width: 56rem;
            color: var(--muted);
            font-size: 1.15rem;
            margin: 0 0 1.5rem
        }

        .btn {
            display: inline-block;
            background: var(--ink);
            color: var(--bg);
            padding: .7rem 1.4rem;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            margin-right: .5rem
        }

        .btn.o {
            background: none;
            color: var(--ink);
            border: 2px solid var(--ink)
        }

        section {
            padding: 2.5rem 0
        }

        h2 {
            font-size: clamp(1.7rem, 4vw, 2.3rem);
            margin-bottom: .4rem
        }

        .lead {
            color: var(--muted);
            margin: 0 0 1.5rem;
            max-width: 56rem
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(15.5rem, 1fr));
            gap: 1.1rem
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            border: 2px solid var(--line);
            border-radius: 1.5rem;
            padding: 1.4rem;
            text-decoration: none;
            background: var(--sf);
            transition: transform .15s, border-color .15s
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-4px);
            border-color: var(--ac)
        }

        .card:nth-child(1) {
            background: var(--mint)
        }

        .card:nth-child(2) {
            background: var(--peach)
        }

        .card:nth-child(3) {
            background: var(--lav)
        }

        .card:nth-child(4) {
            background: var(--sf)
        }

        .card:nth-child(5) {
            background: var(--mint)
        }

        .ic {
            width: 52px;
            height: 52px;
            border-radius: 1rem;
            background: var(--sf);
            display: grid;
            place-items: center;
            font-size: 1.6rem;
            margin-bottom: .4rem
        }

        .ic img {
            width: 38px;
            height: 38px
        }

        .card h3 {
            font-size: 1.3rem
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: .98rem;
            flex: 1
        }

        .card small {
            font-weight: 700;
            color: var(--pink)
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem
        }

        .tags span {
            border: 2px solid var(--ac);
            border-radius: .6rem;
            padding: .1rem .65rem;
            font-weight: 700;
            font-size: .9rem
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem
        }

        .box {
            background: var(--sf);
            border: 2px solid var(--line);
            border-radius: 1.25rem;
            padding: 1.4rem
        }

        .box h3 {
            margin-bottom: .7rem;
            font-size: 1.2rem
        }

        .box p {
            margin: .2rem 0;
            color: var(--muted)
        }

        .box b {
            color: var(--ink)
        }

        .back {
            display: inline-block;
            margin: 1rem 0 1.5rem;
            font-weight: 700;
            text-decoration: none
        }

        .back:hover {
            color: var(--pink)
        }

        .det h1 {
            font-size: clamp(2rem, 6vw, 3.4rem);
            margin: .5rem 0 1rem
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 1.5rem
        }

        .meta span {
            background: var(--lav);
            border-radius: 999px;
            padding: .25rem .9rem;
            font-weight: 700;
            font-size: .9rem
        }

        .det p {
            max-width: 56rem
        }

        .det ul {
            max-width: 56rem;
            padding-left: 1.2rem
        }

        .det li {
            margin: .5rem 0
        }

        .pn {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 2.5rem;
            padding-top: 1.25rem;
            border-top: 2px solid var(--line);
            font-weight: 700;
            flex-wrap: wrap
        }

        .pn a {
            text-decoration: none
        }

        .pn a:hover {
            color: var(--pink)
        }

        footer {
            border-top: 2px solid var(--line);
            margin-top: 2rem;
            padding: 1.5rem 0 2.5rem;
            color: var(--muted);
            font-size: .95rem
        }

        a:focus-visible {
            outline: 3px solid var(--ac);
            outline-offset: 3px
        }

        @media (max-width:48rem) {
            .w {
                width: 100%;
                padding: 0 1rem
            }
        }

        @media (max-width:42rem) {
            .two {
                grid-template-columns: 1fr
            }
        }

        @media (prefers-reduced-motion:reduce) {
            html {
                scroll-behavior: auto
            }

            .card {
                transition: none
            }
        }

        .gal {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
            gap: 1.25rem;
            margin: 0
        }

        .gal figure {
            margin: 0
        }

        .gal a {
            display: block;
            cursor: zoom-in;
            text-decoration: none
        }

        .gal img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            object-position: top;
            border-radius: 1rem;
            border: 2px solid var(--line);
            display: block;
            transition: transform .15s, border-color .15s
        }

        .gal a:hover img {
            transform: translateY(-3px);
            border-color: var(--ac)
        }

        .gal figcaption {
            font-size: .92rem;
            color: var(--muted);
            margin-top: .5rem;
            line-height: 1.4
        }

        .dash-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 1.5rem 0
        }

        .dash-card {
            background: var(--sf);
            border: 2px solid var(--line);
            border-radius: 1.25rem;
            padding: 1.5rem;
            transition: border-color .15s
        }

        .dash-card:hover {
            border-color: var(--ac)
        }

        .dash-badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .25rem .75rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: .85rem
        }

        .badge-pbi {
            background: #fde047;
            color: #713f12
        }

        .badge-excel {
            background: #86efac;
            color: #14532d
        }

        :root[data-theme="dark"] .badge-pbi {
            background: #ca8a04;
            color: #fef08a
        }

        :root[data-theme="dark"] .badge-excel {
            background: #15803d;
            color: #bbf7d0
        }

        .dash-box {
            border: 2px dashed var(--line);
            border-radius: 1rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--muted);
            font-size: .95rem;
            margin-top: .8rem;
            background: var(--bg)
        }

        .dash-preview-wrap {
            margin: 1.25rem 0;
            border: 1px solid var(--line);
            border-radius: 1rem;
            overflow: hidden;
            background: var(--bg)
        }

        .dash-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem;
            padding: .75rem 1.2rem;
            background: var(--lav);
            font-size: .9rem;
            font-weight: 700
        }

        .dash-frame {
            width: 100%;
            height: 520px;
            border: none;
            display: block;
            background: #fff
        }

        @media (max-width: 768px) {
            .dash-frame {
                height: 360px
            }
        }

        .dash-meta-bar {
            padding: .6rem 1.2rem;
            font-size: .88rem;
            color: var(--muted);
            border-top: 1px solid var(--line);
            background: var(--sf);
            font-weight: 600
        }

        .dash-img-link {
            display: block;
            cursor: zoom-in;
            background: #fff;
            transition: opacity .15s
        }

        .dash-img-link:hover {
            opacity: .96
        }

        .dash-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain
        }

        .dash-sec {
            margin-top: 1.25rem
        }

        .dash-sec h4 {
            font-family: var(--hf);
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 .4rem;
            color: var(--ink)
        }

        .dash-sec p {
            margin: 0 0 .5rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6
        }

        .dash-sec ul,
        .dash-sec ol {
            margin: 0 0 .6rem;
            padding-left: 1.4rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6
        }

        .dash-sec li {
            margin-bottom: .35rem
        }
    </style>
</head>
